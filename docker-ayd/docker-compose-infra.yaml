services:
  ayd-postgres:
    image: postgres
    container_name: ayd-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: ayddb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    extends:
      file: docker-common.yaml
      service: ayd-network-service

  ayd-kafka:
    image: apache/kafka:latest
    container_name: ayd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://ayd-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ayd-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    extends:
      file: docker-common.yaml
      service: ayd-network-service


  ayd-redis:
    image: redis/redis-stack:latest
    container_name: ayd-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    extends:
      file: docker-common.yaml
      service: ayd-network-service

  ayd-minio:
    image: quay.io/minio/minio:latest
    container_name: ayd-minio
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: ask-my-doc
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    extends:
      file: docker-common.yaml
      service: ayd-network-service

  ayd-qdrant:
    image: qdrant/qdrant:latest
    container_name: ayd-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    extends:
      file: docker-common.yaml
      service: ayd-network-service

  ayd-keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: ayd-keycloak
    ports:
      - "7080:8080"
    volumes:
      - keycloak-bkp:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME: ${MACHINE_URL}
    command: "start-dev --import-realm"
    extends:
      file: docker-common.yaml
      service: ayd-network-service


volumes:
  pgdata:
  esdata:
  minio_data:
  qdrant_data:
  keycloak-bkp:

networks:
  ayd:
    driver: "bridge"